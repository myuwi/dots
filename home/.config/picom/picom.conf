backend = "egl";

# Shadow
shadow = true;
shadow-radius = 16;
shadow-offset-x = -16;
shadow-offset-y = -14;
shadow-opacity = 0.4;

# Corners
corner-radius = 8;

# Fading
fading = true;
fade-delta = 2;
fade-in-step = 0.02;
fade-out-step = 0.02;

rules = (
  {
    match =
      "class_g = 'firefox' && window_type = 'utility' || "
      "class_g = 'firefox' && argb || "
      "_GTK_FRAME_EXTENTS@ || "
      "window_type = 'combo' || "
      "window_type = 'dnd' || "
      "window_type = 'dock' || "
      "window_type *= 'menu' && class_g != 'awesome' && class_g != 'fcitx' || "
      "fullscreen || "
      "_SHADOW_DISABLE@"
    shadow = false;
  },
  { match = "window_type = 'tooltip' || window_type = 'dock' || fullscreen"; corner-radius = 0; },
  { match = "class_g = 'awesome'"; fade = false; },
  { match = "border_width != 0"; shader = "shaders/inset_border.glsl"; },

  # Window geometry
  {
    match = "class_g != 'awesome'";
    animations = ({
      triggers = ["geometry"];
      preset = "geometry-change";
      duration = 0.2;
    })
  },

  # Top popups
  {
    match = "_WM_TRANSITION@ = 'slide-down'";
    animations = ({
      triggers = ["open", "show"];
      opacity = {
        curve = "linear";
        duration = 0.1;
        start = "window-raw-opacity-before";
        end = "window-raw-opacity";
      };
      shadow-opacity = "opacity";
      offset-y = {
        curve = "cubic-bezier(0.24, 0.64, 0.78, 0.98)";
        duration = 0.1;
        start = -16;
        end = 0;
      };
      shadow-offset-y = "offset-y";
    },{
      triggers = ["close", "hide"];
      opacity = {
        curve = "linear";
        duration = 0.1;
        start = "window-raw-opacity-before";
        end = 0;
      };
      shadow-opacity = "opacity";
      offset-y = {
        curve = "cubic-bezier(0.21, 0.02, 0.76, 0.36)";
        duration = 0.1;
        start = 0;
        end = -16;
      };
      shadow-offset-y = "offset-y";
    });
  },

  # Bottom popups
  {
    match = "_WM_TRANSITION@ = 'slide-up'";
    animations = ({
      triggers = ["open", "show"];
      opacity = {
        curve = "linear";
        duration = 0.1;
        start = "window-raw-opacity-before";
        end = "window-raw-opacity";
      };
      shadow-opacity = "opacity";
      offset-y = {
        curve = "cubic-bezier(0.24, 0.64, 0.78, 0.98)";
        duration = 0.1;
        start = 16;
        end = 0;
      };
      shadow-offset-y = "offset-y";
    },{
      triggers = ["close", "hide"];
      opacity = {
        curve = "linear";
        duration = 0.1;
        start = "window-raw-opacity-before";
        end = 0;
      };
      shadow-opacity = "opacity";
      offset-y = {
        curve = "cubic-bezier(0.21, 0.02, 0.76, 0.36)";
        duration = 0.1;
        start = 0;
        end = 16;
      };
      shadow-offset-y = "offset-y";
    });
  },

  # Workspace transitions
  {
    match = "_WM_TRANSITION@ = 'workspace-left'";
    animations = ({
      triggers = ["show"];
      crop-x = "window-monitor-x";
      crop-y = "window-monitor-y";
      crop-width = "window-monitor-width";
      crop-height = "window-monitor-height";
      offset-x = {
        curve = "cubic-bezier(0.1, 0.9, 0.2, 1)";
        duration = 0.35;
        start = "-window-monitor-width";
        end = 0;
      };
      shadow-offset-x = {
        curve = "cubic-bezier(0.1, 0.9, 0.2, 1)";
        duration = 0.35;
        start = "-window-monitor-width";
        end = 0;
      };
      opacity = {
        curve = "cubic-bezier(0.1, 0.9, 0.2, 1)";
        duration = 0.35;
        start = 1;
        end = "window-raw-opacity";
      };
    },{
      triggers = ["hide"];
      crop-x = "window-monitor-x";
      crop-y = "window-monitor-y";
      crop-width = "window-monitor-width";
      crop-height = "window-monitor-height";
      offset-x = {
        curve = "cubic-bezier(0.1, 0.9, 0.2, 1)";
        duration = 0.35;
        start = 0;
        end = "-window-monitor-width";
      };
      shadow-offset-x = {
        curve = "cubic-bezier(0.1, 0.9, 0.2, 1)";
        duration = 0.35;
        start = 0;
        end = "-window-monitor-width";
      };
      opacity = {
        curve = "cubic-bezier(0.1, 0.9, 0.2, 1)";
        duration = 0.35;
        start = "window-raw-opacity-before";
        end = 1;
      };
    });
  },
  {
    match = "_WM_TRANSITION@ = 'workspace-right'";
    animations = ({
      triggers = ["show"];
      crop-x = "window-monitor-x";
      crop-y = "window-monitor-y";
      crop-width = "window-monitor-width";
      crop-height = "window-monitor-height";
      offset-x = {
        curve = "cubic-bezier(0.1, 0.9, 0.2, 1)";
        duration = 0.35;
        start = "window-monitor-width";
        end = 0;
      };
      shadow-offset-x = {
        curve = "cubic-bezier(0.1, 0.9, 0.2, 1)";
        duration = 0.35;
        start = "window-monitor-width";
        end = 0;
      };
      opacity = {
        curve = "cubic-bezier(0.1, 0.9, 0.2, 1)";
        duration = 0.35;
        start = 1;
        end = "window-raw-opacity";
      };
    },{
      triggers = ["hide"];
      crop-x = "window-monitor-x";
      crop-y = "window-monitor-y";
      crop-width = "window-monitor-width";
      crop-height = "window-monitor-height";
      offset-x = {
        curve = "cubic-bezier(0.1, 0.9, 0.2, 1)";
        duration = 0.35;
        start = 0;
        end = "window-monitor-width";
      };
      shadow-offset-x = {
        curve = "cubic-bezier(0.1, 0.9, 0.2, 1)";
        duration = 0.35;
        start = 0;
        end = "window-monitor-width";
      };
      opacity = {
        curve = "cubic-bezier(0.1, 0.9, 0.2, 1)";
        duration = 0.35;
        start = "window-raw-opacity-before";
        end = 1;
      };
    });
  },
);
