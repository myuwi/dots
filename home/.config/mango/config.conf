# Environment
env=GTK_IM_MODULE,simple

# Autostart
exec-once=wl-clip-persist --clipboard regular
# exec-once=wl-paste --type text --watch xclip -selection clipboard
exec-once=lxqt-policykit-agent
exec-once=swayidle -w

exec-once=shikane

exec-once=awww-daemon
exec-once=awww restore
exec-once=quickshell

exec-once=solaar -w hide

# Behavior
allow_tearing=1
syncobj_enable=1

sloppyfocus=0
focus_on_activate=1
focus_cross_monitor=0
focus_cross_tag=0

warpcursor=0
cursor_theme=Adwaita
cursor_size=24

idleinhibit_ignore_visible=0

enable_floating_snap=0
snap_distance=30
drag_tile_to_tile=1
drag_tile_small=0
drag_corner=4

axis_bind_apply_timeout=100

# Input
# Keyboard
repeat_rate=30
repeat_delay=200
xkb_rules_layout=fi
numlockon=0

# Trackpad
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1

# Mouse
mouse_natural_scrolling=0
mouse_accel_profile=1
mouse_accel_speed=0.0

# Appearance
gappih=8
gappiv=8
gappoh=8
gappov=8
smartgaps=0

borderpx=1
border_radius=6
no_border_when_single=0
no_radius_when_single=0

focused_opacity=1.0
unfocused_opacity=1.0

scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9

# Colors
rootcolor=0x201b14ff
# bordercolor=0x00000033
# focuscolor=0xc9b890ff
# focuscolor=0xf7b83dff
focuscolor=0xebbcbaff
maximizescreencolor=0x89aa61ff
urgentcolor=0xad401fff
scratchpadcolor=0x516c93ff
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff

# Blur
blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

# Shadows
shadows = 1
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadowscolor= 0x000000cc

# Animations
# tag_animation_direction: 1-horizontal, 0-vertical
# type: zoom, slide
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=250
animation_duration_open=200
animation_duration_tag=250
animation_duration_close=200
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,0.99
animation_curve_move=0.46,1.0,0.29,0.99
animation_curve_tag=0.46,1.0,0.29,0.99
animation_curve_close=0.46,1.0,0.29,0.99
animation_curve_focus=0.46,1.0,0.29,0.99
animation_curve_opafadein=0.46,1.0,0.29,0.99
animation_curve_opafadeout=0.5,0.5,0.5,0.5

# Layouts
# supported: tile, scroller, grid, deck, monocle, center_tile, vertical_tile, vertical_scroller
circle_layout=tile,monocle

# Master-Stack
new_is_master=0
default_mfact=0.55
default_nmaster=1

# Monocle
tab_bar_height=0

# Per-tag layouts
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

# Window rules
windowrule=isfullscreen:1,appid:overwatch.exe

# Layer rules
layerrule=noblur:1,noanim:1,layer_name:notifications
# layerrule=animation_type_open:zoom,layer_name:launcher
# layerrule=animation_type_close:zoom,layer_name:launcher
# layerrule=animation_type_open:zoom,layer_name:window-switcher
# layerrule=animation_type_close:zoom,layer_name:window-switcher

# Keybinds
# key names: see `xev` or `wev`
# mod keys: super, ctrl, alt, shift, none

# Compositor
bind=SUPER+CTRL,r,reload_config

# Applications
bind=SUPER,Return,spawn,ghostty
bind=SUPER,d,spawn,fuzzel

# Screenshot
bind=NONE,Print,spawn_shell,grim -o "$(mmsg get cursorpos | jq -r .monitor)" - | wl-copy
bind=CTRL,Print,spawn_shell,grim -g "$(slurp -o)" - | wl-copy

# Save Replay
bind=SUPER,F1,spawn,replay-buffer save

# Volume / media
bind=SUPER,m,spawn_shell,wpctl set-mute @DEFAULT_SOURCE@ toggle; qs ipc call -- osd microphone
bind=NONE,XF86AudioRaiseVolume,spawn_shell,wpctl set-volume -l 1 @DEFAULT_SINK@ 0.05+; qs ipc call -- osd volume
bind=NONE,XF86AudioLowerVolume,spawn_shell,wpctl set-volume -l 1 @DEFAULT_SINK@ 0.05-; qs ipc call -- osd volume
bind=NONE,XF86AudioMute,spawn_shell,wpctl set-mute @DEFAULT_SINK@ toggle; qs ipc call -- osd volume
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86AudioStop,spawn,playerctl stop
bind=NONE,XF86MonBrightnessUp,spawn,brillo -q -u 100000 -A 5
bind=NONE,XF86MonBrightnessDown,spawn,brillo -q -u 100000 -U 5

# Window state
bind=SUPER+SHIFT,q,killclient,
bind=SUPER+SHIFT,f,togglefloating,
bind=SUPER,f,togglefullscreen,
bind=SUPER,c,centerwin

# Focus / swap
bind=SUPER,Tab,spawn,qs ipc call -- windowSwitcher show 1
bind=SUPER+SHIFT,Tab,spawn,qs ipc call -- windowSwitcher show -1
# Catch Super release before the switcher's layer has acquired keyboard focus.
bindr=SUPER,Super_L,spawn,qs ipc call -- windowSwitcher commit
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,l,exchange_client,right

# Layout
bind=SUPER,s,switch_layout

# Tags
# view: switch to and focus the tag
# tagsilent: move client to the tag without focusing it
bind=SUPER,1,spawn,~/.config/mango/scripts/view_on_cursor_monitor.sh 1
bind=SUPER,2,spawn,~/.config/mango/scripts/view_on_cursor_monitor.sh 2
bind=SUPER,3,spawn,~/.config/mango/scripts/view_on_cursor_monitor.sh 3
bind=SUPER,4,spawn,~/.config/mango/scripts/view_on_cursor_monitor.sh 4
bind=SUPER,5,spawn,~/.config/mango/scripts/view_on_cursor_monitor.sh 5
bind=SUPER,6,spawn,~/.config/mango/scripts/view_on_cursor_monitor.sh 6
bind=SUPER,7,spawn,~/.config/mango/scripts/view_on_cursor_monitor.sh 7
bind=SUPER,8,spawn,~/.config/mango/scripts/view_on_cursor_monitor.sh 8
bind=SUPER,9,spawn,~/.config/mango/scripts/view_on_cursor_monitor.sh 9

bind=SUPER+Shift,1,tagsilent,1,0
bind=SUPER+Shift,2,tagsilent,2,0
bind=SUPER+Shift,3,tagsilent,3,0
bind=SUPER+Shift,4,tagsilent,4,0
bind=SUPER+Shift,5,tagsilent,5,0
bind=SUPER+Shift,6,tagsilent,6,0
bind=SUPER+Shift,7,tagsilent,7,0
bind=SUPER+Shift,8,tagsilent,8,0
bind=SUPER+Shift,9,tagsilent,9,0

# Monitor
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=SUPER+SHIFT,Left,tagmon,left
bind=SUPER+SHIFT,Right,tagmon,right

# Mouse
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# Scroll wheel
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# Machine-specific configuration
source-optional=./local.conf

# vim: ft=ini
